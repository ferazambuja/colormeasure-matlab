name: Instrument test feedback
description: Share a testLabInstrument result, whether it passed or failed.
title: "Instrument test: "
body:
  - type: markdown
    attributes:
      value: |
        Open `testLabInstrument.m` in MATLAB and click **Run**.
        The report ZIP is saved in Desktop → ColorMeasurement-Reports.
        Attachments are public. The ZIP holds your readings, the instrument's serial number
        and settings, and file paths that can show your user name. To keep those private,
        leave it out and describe the result. If no ZIP was created, paste the error.
  - type: dropdown
    id: instrument
    attributes:
      label: Instrument
      options:
        - PR-655
        - PR-670
        - CR-100
        - CR-250
        - CR-300
        - CS-2000
        - CS-2000A
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Passed
        - Failed
        - Incomplete or cancelled
        - Could not start
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Report or notes
      description: Attach the ZIP, or describe what happened. Include any error text.
    validations:
      required: true
